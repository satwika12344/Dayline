<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dayline – AI Daily Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F4;--surf:#fff;--ink:#14232F;--mut:#5B6B77;--line:#D3DBE1;--acc:#0F766E;--accs:#D5EEEA;--acct:#fff;--hi:#C2410C;--med:#B7791F;--low:#7A8A96;--now:#D6336C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E171E;--surf:#16222B;--ink:#E6EDF2;--mut:#93A4B1;--line:#26343F;--acc:#4FD1C0;--accs:#16403D;--acct:#0E171E;--hi:#FF8A5B;--med:#F5B450;--low:#7F909C;--now:#FF6B9A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E171E;--surf:#16222B;--ink:#E6EDF2;--mut:#93A4B1;--line:#26343F;--acc:#4FD1C0;--accs:#16403D;--acct:#0E171E;--hi:#FF8A5B;--med:#F5B450;--low:#7F909C;--now:#FF6B9A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,.disp{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:clamp(30px,6vw,48px);line-height:1;margin:0}
.sub{color:var(--mut);margin-top:6px}
.prog{min-width:220px;flex:1;max-width:340px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:880px){.grid{grid-template-columns:1.35fr 1fr;align-items:start}}
section{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:18px;margin:0 0 12px}
.add{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.add .title{grid-column:1/-1}
.add .c2{grid-column:span 2}
@media(max-width:520px){.add .c2{grid-column:span 3}}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--acct);border:0;border-radius:8px;padding:9px 16px;font-weight:500}
.btn.alt{background:var(--accs);color:var(--ink)}
.add .go{grid-column:1/-1;justify-self:start}
ul{list-style:none;margin:0;padding:0}
.grp{font:500 13px "IBM Plex Sans",sans-serif;color:var(--mut);margin:14px 0 6px}
.t{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border:1px solid var(--line);border-left:4px solid var(--low);border-radius:8px;margin-bottom:6px}
.t.high{border-left-color:var(--hi)}.t.med{border-left-color:var(--med)}
.t input{width:18px;height:18px;flex:none;accent-color:var(--acc)}
.t .b{flex:1;min-width:0}
.t .n{overflow-wrap:anywhere}
.t.done .n{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);padding:4px 8px;border-radius:6px}
.x:hover{color:var(--hi)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--now);font-size:12.5px;font-weight:500;margin:6px 0}
.nowline:after{content:"";flex:1;height:2px;background:var(--now)}
.empty{color:var(--mut);padding:12px 0}
.week{display:flex;gap:8px;align-items:end;height:72px;margin-top:8px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.week i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;margin-bottom:4px;opacity:.85}
.week .today i{opacity:1}
.chat{display:flex;flex-direction:column;height:520px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;overflow-wrap:anywhere}
.m.bot{background:var(--accs);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.m ol{margin:6px 0 8px;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--acc)}
.say{display:flex;gap:8px}
.toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:20;max-width:calc(100% - 24px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{position:fixed;inset:0;background:rgba(10,20,28,.72);display:grid;place-items:center;padding:16px;z-index:30}
.auth[hidden]{display:none}
#af{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:360px;display:grid;gap:10px}
#af h2{margin:0}#af .row{display:flex;gap:8px}
#aerr{color:var(--hi);min-height:1.3em;font-size:13px}
#out{padding:2px 10px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Dayline</h1>
    <div class="sub" id="date"></div>
    <div class="sub" id="sync" aria-live="polite"></div>
    <div class="sub"><span id="who"></span> <button class="btn alt" type="button" id="out">Sign out</button></div>
  </div>
  <div class="prog"><span id="ptext"></span><div class="bar"><i id="pbar"></i></div></div>
</header>
<div class="grid">
  <div style="display:grid;gap:16px">
    <section>
      <h2>Today’s tasks</h2>
      <form class="add" id="f">
        <div class="title"><label for="ti">Task</label><input id="ti" required maxlength="120" placeholder="Write project report"></div>
        <div class="c2"><label for="tm">Start time (optional)</label><input id="tm" type="time"></div>
        <div class="c2"><label for="du">Minutes</label><input id="du" type="number" min="5" max="480" step="5" value="30"></div>
        <div class="c2"><label for="pr">Priority</label><select id="pr"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></div>
        <div class="c2"><label for="rm">Remind me</label><select id="rm"><option value="-1">No reminder</option><option value="0">At start</option><option value="5">5 min before</option><option value="10" selected>10 min before</option><option value="30">30 min before</option></select></div>
        <button class="btn go" type="submit">Add task</button>
      </form>
      <div id="list"></div>
    </section>
    <section>
      <h2>Completed work</h2>
      <div id="wk" class="week"></div>
    </section>
  </div>
  <section class="chat">
    <h2>Schedule assistant</h2>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="say" id="cf"><input id="ci" aria-label="Message" placeholder="Try: add gym at 18:00 for 45 min" autocomplete="off"><button class="btn" type="submit">Send</button></form>
  </section>
</div>
</div>
<div class="auth" id="auth" hidden>
  <form id="af"><h2>Sign in to Dayline</h2>
    <div><label for="ae">Email</label><input id="ae" type="email" required autocomplete="email"></div>
    <div><label for="ap">Password (8 or more characters)</label><input id="ap" type="password" required minlength="8" autocomplete="current-password"></div>
    <div id="aerr" role="alert"></div>
    <div class="row"><button class="btn" type="submit">Sign in</button><button class="btn alt" type="button" id="areg">Create account</button></div>
  </form>
</div>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<script>
const $=s=>document.querySelector(s);
let S={tasks:[]};
let synced=new Map(),busy=false,es=null;const hist=[];
const setSync=t=>{$('#sync').textContent=t};
async function api(m,u,b){
  const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!u.startsWith('/api/auth/')){showLogin();throw{code:'auth'}}
  if(!r.ok)throw{code:r.status,message:j.error};
  return j;
}
function fail(e){if(e&&e.code==='auth')return;setSync('Sync failed: '+((e&&e.message)||'network error')+'. It retries on your next change.')}
function save(){
  const ids=new Set();
  S.tasks.forEach(t=>{ids.add(t.id);const j=JSON.stringify(t);if(synced.get(t.id)!==j){synced.set(t.id,j);api('PUT','/api/tasks/'+t.id,t).catch(e=>{synced.delete(t.id);fail(e)})}});
  [...synced.keys()].forEach(id=>{if(!ids.has(id)){synced.delete(id);api('DELETE','/api/tasks/'+id).catch(fail)}});
}
async function loadTasks(){
  const from=dkey(new Date(Date.now()-6*864e5));
  const r=await api('GET','/api/tasks?from='+from);
  S.tasks=r.tasks;synced=new Map(S.tasks.map(t=>[t.id,JSON.stringify(t)]));render();setSync('Saved to your account');
}
function startEvents(){
  if(es)es.close();
  es=new EventSource('/api/events');
  es.addEventListener('reminder',e=>{
    const d=JSON.parse(e.data),t=S.tasks.find(x=>x.id===d.id);
    if(t){t.fired=true;synced.set(t.id,JSON.stringify(t))}
    toast('Reminder: '+d.message,true);
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Dayline',{body:d.message})}catch(_){}
  });
}
function showLogin(){$('#auth').hidden=false;if(es)es.close()}
async function enter(){
  const me=await api('GET','/api/me');
  $('#who').textContent=me.email;
  await loadTasks();startEvents();
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(_){}
}
async function authCall(kind){
  $('#aerr').textContent='';
  try{
    await api('POST','/api/auth/'+kind,{email:$('#ae').value,password:$('#ap').value,tz:Intl.DateTimeFormat().resolvedOptions().timeZone});
    $('#auth').hidden=true;$('#ap').value='';await enter();
  }catch(e){$('#aerr').textContent=(e&&e.message)||'Something went wrong. Try again.'}
}
$('#af').addEventListener('submit',e=>{e.preventDefault();authCall('login')});
$('#areg').onclick=()=>{if($('#af').reportValidity())authCall('register')};
$('#out').onclick=()=>{api('POST','/api/auth/logout').catch(()=>{}).finally(()=>{S.tasks=[];synced=new Map();render();showLogin()})};
async function boot(){try{await enter()}catch(e){if(!(e&&e.code==='auth'))setSync('Can’t reach the server.')}}
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toMin=t=>{const p=t.split(':');return +p[0]*60+ +p[1]};
const fmt=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todays=()=>S.tasks.filter(t=>t.date===dkey(new Date()));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function addTask(o){
  S.tasks.push(Object.assign({id:uid(),date:dkey(new Date()),time:'',dur:30,pri:'med',rem:-1,done:false,fired:false},o));
  save();render();
}

function render(){
  const d=new Date(), T=todays();
  $('#date').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const done=T.filter(t=>t.done).length;
  $('#ptext').textContent=T.length?done+' of '+T.length+' tasks done':'No tasks yet today';
  $('#pbar').style.width=(T.length?done/T.length*100:0)+'%';
  const timed=T.filter(t=>t.time).sort((a,b)=>toMin(a.time)-toMin(b.time));
  const un=T.filter(t=>!t.time);
  const row=t=>{
    const end=t.time?' to '+fmt(toMin(t.time)+t.dur):'';
    return '<li class="t '+t.pri+(t.done?' done':'')+'"><input type="checkbox" data-c="'+t.id+'" '+(t.done?'checked':'')+' aria-label="Mark done"><div class="b"><div class="n">'+esc(t.title)+'</div><div class="meta">'+(t.time?'<span>'+t.time+end+'</span>':'')+'<span>'+t.dur+' min</span>'+(t.rem>=0?'<span>Reminder '+(t.rem?t.rem+' min before':'at start')+'</span>':'')+'</div></div><button class="x" data-x="'+t.id+'" aria-label="Delete task">✕</button></li>';
  };
  let h='';
  if(timed.length){
    h+='<div class="grp">Scheduled</div><ul>';
    const nm=nowMin();let placed=false;
    timed.forEach(t=>{if(!placed&&toMin(t.time)>nm){h+='<div class="nowline">Now '+fmt(nm)+'</div>';placed=true}h+=row(t)});
    if(!placed)h+='<div class="nowline">Now '+fmt(nm)+'</div>';
    h+='</ul>';
  }
  if(un.length)h+='<div class="grp">Unscheduled</div><ul>'+un.map(row).join('')+'</ul>';
  if(!T.length)h='<div class="empty">No tasks for today. Add one above, or ask the assistant to plan your day.</div>';
  $('#list').innerHTML=h;
  // week
  const days=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push(x)}
  const cnt=days.map(x=>S.tasks.filter(t=>t.date===dkey(x)&&t.done).length);
  const mx=Math.max(1,...cnt);
  $('#wk').innerHTML=days.map((x,i)=>'<div'+(i===6?' class="today"':'')+' title="'+cnt[i]+' completed"><i style="height:'+Math.round(cnt[i]/mx*44)+'px"></i>'+x.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'</div>').join('');
}

$('#list').addEventListener('click',e=>{
  const c=e.target.closest('[data-c]'),x=e.target.closest('[data-x]');
  if(c){const t=S.tasks.find(t=>t.id===c.dataset.c);if(t){t.done=c.checked;save();render();if(t.done)toast('Done: '+t.title)}}
  if(x){S.tasks=S.tasks.filter(t=>t.id!==x.dataset.x);save();render()}
});

$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  const rem=+$('#rm').value,tm=$('#tm').value;
  addTask({title:$('#ti').value.trim(),time:tm,dur:Math.max(5,+$('#du').value||30),pri:$('#pr').value,rem:tm?rem:-1});
  if(tm&&rem>=0){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(_){}}
  $('#ti').value='';$('#tm').value='';$('#ti').focus();
});

// reminders
function toast(msg,sticky){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML='<span>'+esc(msg)+'</span><button type="button">Dismiss</button>';
  el.querySelector('button').onclick=()=>el.remove();
  $('#toasts').appendChild(el);
  if(!sticky)setTimeout(()=>el.remove(),5000);
}
// assistant
let pending=null;
const log=$('#log');
function say(html,who,act){
  const m=document.createElement('div');m.className='m '+(who||'bot');
  if(who==='me')m.textContent=html;else m.innerHTML=html;
  if(act){const b=document.createElement('button');b.className='btn alt';b.textContent=act.label;b.onclick=()=>{act.fn();b.disabled=true};m.appendChild(b)}
  log.appendChild(m);log.scrollTop=log.scrollHeight;return m;
}
function propose(){
  const T=todays(),un=T.filter(t=>!t.done&&!t.time);
  if(!un.length){say('Nothing to place. Add tasks without a start time and I’ll fit them around your scheduled ones.');return}
  const busy=T.filter(t=>!t.done&&t.time).map(t=>[toMin(t.time),toMin(t.time)+t.dur]);
  let cur=Math.max(540,Math.ceil((nowMin()+5)/15)*15);
  const r={high:0,med:1,low:2};
  un.sort((a,b)=>r[a.pri]-r[b.pri]||b.dur-a.dur);
  const plan=[],left=[];
  for(const t of un){
    let mv=true;
    while(mv){mv=false;for(const b of busy){if(cur<b[1]&&cur+t.dur>b[0]){cur=b[1]+10;mv=true}}}
    if(cur+t.dur>1290){left.push(t);continue}
    plan.push([t,cur]);busy.push([cur,cur+t.dur]);cur+=t.dur+10;
  }
  if(!plan.length){say('There isn’t enough time left today for these tasks. Try shortening them or moving some to tomorrow.');return}
  pending=plan;
  let h='Here’s a plan. High-priority and longer tasks go first, with 10 minutes between tasks:<ol>'+plan.map(p=>'<li>'+fmt(p[1])+' – '+esc(p[0].title)+' ('+p[0].dur+' min)</li>').join('')+'</ol>';
  if(left.length)h+='Won’t fit today: '+left.map(t=>esc(t.title)).join(', ')+'.<br>';
  say(h,'bot',{label:'Apply schedule',fn:applyPlan});
}
function applyPlan(){
  if(!pending)return;
  pending.forEach(p=>{const t=S.tasks.find(x=>x.id===p[0].id);if(t){t.time=fmt(p[1]);if(t.rem<0)t.rem=10;t.fired=false}});
  pending=null;save();render();say('Scheduled. I’ll remind you 10 minutes before each task that had no reminder.');
}
function reply(q){
  const l=q.toLowerCase();
  let m=q.match(/^add\s+(.+?)(?:\s+at\s+(\d{1,2}):(\d{2}))?(?:\s+for\s+(\d+)\s*(?:min|minutes))?\s*$/i);
  if(m){
    const time=m[2]?pad(+m[2])+':'+m[3]:'';
    addTask({title:m[1],time,dur:m[4]?+m[4]:30,rem:time?10:-1});
    say('Added “'+esc(m[1])+'”'+(time?' at '+time+' with a 10-minute reminder':'')+'.');return;
  }
  if(/plan|schedul|organi[sz]e|arrange/.test(l))return propose();
  if(/apply|yes|confirm/.test(l)&&pending)return applyPlan();
  if(/next|now|what.*(do|should)/.test(l)){
    const nm=nowMin(),c=todays().filter(t=>!t.done);
    const nx=c.filter(t=>t.time&&toMin(t.time)+t.dur>nm).sort((a,b)=>toMin(a.time)-toMin(b.time))[0];
    if(nx)say('Next up: <b>'+esc(nx.title)+'</b> at '+nx.time+'.');
    else if(c.length)say('Nothing is scheduled next. Your open task: <b>'+esc(c[0].title)+'</b>. Want me to plan your day?');
    else say('You have no open tasks. Add something or enjoy the break.');
    return;
  }
  if(/how|progress|done|status|summary/.test(l)){
    const T=todays(),d=T.filter(t=>t.done).length,mins=T.filter(t=>t.done).reduce((a,t)=>a+t.dur,0);
    say(T.length?'You’ve finished '+d+' of '+T.length+' tasks today ('+mins+' planned minutes of work). '+(d===T.length?'Everything is done.':(T.length-d)+' left.'):'No tasks yet today.');return;
  }
  say('I can plan your day, tell you what’s next, summarize progress, or add tasks. Try “add call dentist at 15:30 for 20 min”.');
}
async function send(q){
  q=q.trim();if(!q||busy)return;
  say(q,'me');busy=true;const wait=say('Thinking…');
  try{
    const r=await api('POST','/api/assistant',{message:q,now:fmt(nowMin()),date:dkey(new Date()),history:hist.slice(-6)});
    wait.remove();
    hist.push({user:q,assistant:String(r.reply||'')});
    const ok=s=>/^\d{1,2}:\d{2}$/.test(s||'');
    const nt=s=>String(s).replace(/^(\d):/,'0$1:');
    (r.add||[]).filter(a=>a&&a.title).slice(0,10).forEach(a=>{
      const tm=ok(a.time)?nt(a.time):'';
      addTask({title:String(a.title).slice(0,120),time:tm,dur:Math.min(480,Math.max(5,+a.minutes||30)),pri:['high','med','low'].includes(a.priority)?a.priority:'med',rem:tm?10:-1});
    });
    const sc=(r.schedule||[]).filter(x=>x&&ok(x.time)&&S.tasks.some(t=>t.id===x.id));
    let h=esc(r.reply||'Done.');
    if(sc.length){
      pending=sc.map(x=>[S.tasks.find(t=>t.id===x.id),toMin(nt(x.time))]).sort((a,b)=>a[1]-b[1]);
      h+='<ol>'+pending.map(p=>'<li>'+fmt(p[1])+' – '+esc(p[0].title)+'</li>').join('')+'</ol>';
      say(h,'bot',{label:'Apply schedule',fn:applyPlan});
    }else say(h);
  }catch(e){
    wait.remove();
    if(!(e&&e.code==='auth')){say('The AI assistant isn’t available ('+((e&&e.message)||'error')+'), so here’s the rule-based answer.');reply(q)}
  }
  busy=false;
}
$('#cf').addEventListener('submit',e=>{e.preventDefault();send($('#ci').value);$('#ci').value=''});
